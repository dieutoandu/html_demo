<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test_BMI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #040424;
            color: #92e49d;
        }
        h1 {
            text-align: center;
            color: #4CAF50;
            margin-top: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            text-align: center;
            
        }
        label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #a8e9b1;
        }
        input[type="text"],
        input[type="number"],
        input[type="file"],
        select {
            padding: 10px;
            margin: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            text-align: center;
        }
        button {
            padding: 10px;

            background-color: #4CAF50;
            color: rgb(218, 208, 208);
            border: none;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        a {
            text-align: center;
            display: block;
            margin-top: 20px;
            text-decoration: none;
            color: #4CAF50;
            font-size: 16px;
        }

        .inp{
            margin: 20px;
        }
    </style>
</head>
<body>
    <h1>test_BMI</h1>
    <form action="">
        <label for="usernames">Name</label>
        <input id="username" name="username" type="text" placeholder="please input your name">
        <br>
        <label for="age">age</label>
        <input id="age" name="age" type="number" placeholder="18">
        <br>
        <label for="height">height</label>
        <input id="height" name="height" type="number" step="0.1">
        <br>
        <label for="weight">weight</label>
        <input id="weight" name="weight" type="number" step="0.1">
        <br>
        <div class="inp">
            <input type="radio" name="sex" id="male" checked>man
            <input type="radio" name="sex" id="female">girl
        </div>
        
        <input type="file" name="" id="">

        <br>
        <label for="county">country</label>
        <select name="county" id="county">
            <option value="tapei">tapei</option>
            <option value="japan">japan</option>
            <option value="vietnam">vietnam</option>
            <option value="usa">usa</option>
            <option value="china">china</option>
        </select>

        
        <br>
        <button type="submit">start</button>

        

    </form>
    <a href="index.html">HOME</a>
</body>
</html>
