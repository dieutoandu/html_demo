<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test_BMI</title>

    <link rel="stylesheet" href="css/style.css">
    <style>
        h1 {
            margin: 10px;
            padding: 10px;
            text-align: center;
            color: #6e81eb;
            margin-top: 20px;
        }

        form {
            width: 40%;
            background-color: #19e2c7;
            text-align: center;
            margin: 24px auto;
            border-radius: 12px;
            box-shadow: 10px 10px 5px lightblue;

        }

        label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #146d20;
            font-size: 20px;
        }

        input[type="text"],
        input[type="number"],

        select {
            padding: 10px;
            margin: 10px 0px;
            border: 1px solid #4e1515;
            font-size: 20px;
            text-align: center;

        }

        .inp {
            background-color: rgb(111, 148, 180);
            padding: 6px;
            border: 2px dotted pink;
            margin: 6px;

        }


        button {
            margin-top: 1rem;
            width: 120px;
            height: 35px;
            background-color: #4e8a51;
            color: rgb(253, 251, 251);
            border: none;
            font-size: 16px;
            border-radius: 10px;
        }

        button:hover {
            background-color: #4e1515;
            cursor: pointer;
        }


        a {
            text-align: center;
            border-radius: 10px;
            background-color: yellow;
            text-decoration: none;
            color: #08470a;
            font-size: 16px;
            padding: 12px;

        }

        a:hover {
            color: rgb(20, 22, 8);
            background-color: red';
 cursor: pointer;

        }


        #result {
            font-size: 1.5rem;
            font-weight: bold;
            background-color: #2cada3;
            border-radius: 10px;
        }

        .comment {
            font-size: 1.5rem;

        }

        #info {
            font-size: 1rem;
            font-weight: bold;
            color: #08470a;
            background-color: #b2d8c2;
            border-radius: 10px;

        }

        @media screen and (max-width:600px) {

            form {
                width: 80%
            }
        }
    </style>
</head>

<body>
    <h1 style="background-color: rgb(10, 48, 43);">test_BMI</h1>
    <form action="">
        <label for="usernames">Name</label>
        <input id="username" name="username" type="text" placeholder="please input your name">
        <br>
        <label for="age">age__</label>
        <input id="age" name="age" type="number" placeholder="18">
        <br>
        <label for="height">height</label>
        <input id="height" name="height" type="number" step="0.1" value="160">
        <br>
        <label for="weight">weight</label>
        <input id="weight" name="weight" type="number" step="0.1" value="54">
        <br>
        <div class="inp">
            <input type="radio" name="sex" id="male" checked value="man">man
            <input type="radio" name="sex" id="female" value="girl">girl






            <label for="county">country</label>
            <select name="county" id="county">
                <option value="tapei">tapei</option>
                <option value="japan">japan</option>
                <option value="vietnam">vietnam</option>
                <option value="usa">usa</option>
                <option value="china">china</option>
            </select>

        </div>

        <button type="button" onclick="calc()">start</button>



    </form>

    <div id="info">

    </div>


    <div id="result">
        BMI:<span class="bmi">

        </span>
        <p class="comment">
            健康
        </p>

    </div>



    <a href="index.html">HOME</a>


    <script>

        const nameEl = document.querySelector("#username");
        const ageEl = document.querySelector("#age");
        const heightEl = document.querySelector("#height");
        const weightEl = document.querySelector("#weight");
        const countyEl = document.querySelector("#county");
        const sexEl = document.querySelector("input[name='sex']:checked");

        console.log(sexEl, sexEl.value, nameEl, nameEl.value, ageEl, ageEl.value, heightEl, heightEl.value, weightEl, weightEl.value, countyEl, countyEl.value);



        function calc() {
            let height = heightEl.value;
            let weight = weightEl.value;

            if (height <= 0 || weight <= 0) {
                alert("please input number ")
                return;
            }


            let bmi = get_BMI(height, weight);
            let result = getComment(bmi);
            console.log(bmi, result[0], result[1]);

            const bmiEl = document.querySelector(".bmi")
            bmiEl.innerText = bmi;
            bmiEl.style.color = result[1]

            document.querySelector(".comment").innerText = result[0]
            document.querySelector(".comment").style.color = result[1]

            let sexEl = document.querySelector("input[name='sex']:checked");
            let userinfo = `${nameEl.value} age:${age.value} county:${countyEl.value} sex:${sexEl.value}`

            document.querySelector("#info").innerHTML = `<h1>${nameEl.value} age:${age.value} county:${countyEl.value} sex:${sexEl.value}</h1>`


        }

        function getComment(bmi) {
            if (bmi < 18.5) {
                comment = "「體重過輕」，需要多運動，均衡飲食，以增加體能，維持健康！"
                color = 'cyan'
            }

            else if (bmi < 24) {
                comment = "恭喜！「健康體重」，要繼續保持！"
                color = 'green'
            }

            else if (bmi < 27) {
                comment = "「體重過重」了，要小心囉，趕快力行「健康體重管理」！"
                color = 'orange'
            }
            else {
                comment = "啊～「肥胖」，需要立刻力行「健康體重管理」囉！"
                color = 'red'
            }

            return [comment, color];


        }


        function get_BMI(height, weight) {
            const bmi = weight / (height / 100) ** 2;
            return bmi.toFixed(2);

        }





    </script>


</body>

</html>
