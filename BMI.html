<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test_BMI</title>

    <link rel="stylesheet" href="css/style.css">
    <style>
        
        h1 {
            margin: 10px;
            padding: 10px;
            text-align: center;
            color: #6e81eb;
            margin-top: 20px;
        }
        form {
            width: 40%;
            background-color: #19e2c7;
            text-align: center;
            margin: 24px auto;
            border-radius: 12px;
            box-shadow: 10px 10px 5px lightblue;
            
        }
        label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #146d20;
            font-size: 20px;
        }
        input[type="text"],
        input[type="number"],
        
        select {
            padding: 10px;
            margin: 10px 0px;
            border: 1px solid #4e1515;
            font-size: 20px;
           
        }

        .inp{
            background-color: rgb(111, 148, 180);
            padding: 6px;
            border: 2px dotted pink;
            margin: 6px;

        }
        

        button {
            margin-top: 1rem;
            width: 120px;
            height: 35px;
            background-color: #4e8a51;
            color: rgb(253, 251, 251);
            border: none;
            font-size: 16px;
            border-radius: 10px;
        }
       
        button:hover{
            background-color: #4e1515;
            cursor: pointer;
        }


        a {
            text-align: center;
            display: block;
            text-decoration: none;
            color: #08470a;
            font-size: 16px;
            padding: 12px;

        }

        a:hover{
            color: rgb(194, 233, 21);
        }


    </style>
</head>
<body>
    <h1 style="background-color: rgb(10, 48, 43);">test_BMI</h1>
    <form action="">
        <label for="usernames">Name</label>
        <input id="username" name="username" type="text" placeholder="please input your name">
        <br>
        <label for="age">age__</label>
        <input id="age" name="age" type="number" placeholder="18">
        <br>
        <label for="height">height</label>
        <input id="height" name="height" type="number" step="0.1">
        <br>
        <label for="weight">weight</label>
        <input id="weight" name="weight" type="number" step="0.1">
        <br>
        <div class="inp">
            <input type="radio" name="sex" id="male" checked>man
            <input type="radio" name="sex" id="female">girl
           
        
        
        

       
        <label for="county">country</label>
        <select name="county" id="county">
            <option value="tapei">tapei</option>
            <option value="japan">japan</option>
            <option value="vietnam">vietnam</option>
            <option value="usa">usa</option>
            <option value="china">china</option>
        </select>

        </div>
        
        <button type="submit">start</button>

        

    </form>
    <a href="index.html">HOME</a>
</body>
</html>
