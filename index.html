<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test_BMI</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/bmi.css">
    <style>

    </style>
    <script src="js/bmi.js"></script>
</head>

<body>
    <h1 style="background-color: rgb(10, 48, 43);">test_BMI</h1>

    <div id="record">

    </div>

    <form action="">
        <label for="usernames">Name</label>
        <input id="username" name="username" type="text" placeholder="please input your name">
        <br>
        <label for="age">age__</label>
        <input id="age" name="age" type="number" placeholder="18">
        <br>
        <label for="height">height</label>
        <input id="height" name="height" type="number" step="0.1" value="160">
        <br>
        <label for="weight">weight</label>
        <input id="weight" name="weight" type="number" step="0.1" value="54">
        <br>
        <div class="inp">
            <input type="radio" name="sex" id="male" checked value="man">man
            <input type="radio" name="sex" id="female" value="girl">girl






            <label for="county">country</label>
            <select name="county" id="county">
                <option value="tapei">tapei</option>
                <option value="japan">japan</option>
                <option value="vietnam">vietnam</option>
                <option value="usa">usa</option>
                <option value="china">china</option>
            </select>

        </div>

        <button type="button" onclick="calc()">start</button>
        <button type="button" id="del" style="background-color: red; color: rgb(238, 232, 232);">DELETE</button>
        <button type="button" style="background-color: blue;" onclick="save()">Save</button>
        <a href="index.html">HOME</a>


    </form>

    <div id="info">

    </div>


    <div id="result" hidden="true">
        BMI:<span class="bmi">

        </span>
        <p class="comment">
            健康
        </p>

    </div>


    <div id="tableRecord">


    </div>






    <script>

        const nameEl = document.querySelector("#username");
        const ageEl = document.querySelector("#age");
        const heightEl = document.querySelector("#height");
        const weightEl = document.querySelector("#weight");
        const countyEl = document.querySelector("#county");
        const sexEl = document.querySelector("input[name='sex']:checked");
        const delEl = document.querySelector("#del")
        //console.log(sexEl, sexEl.value, nameEl, nameEl.value, ageEl, ageEl.value, heightEl, heightEl.value, weightEl, weightEl.value, countyEl, countyEl.value);
        //console.log(delEl);

        function save() {
            let datas = JSON.parse(localStorage.getItem("datas"));
            console.log(datas);

            if (datas == null || datas.length == 0) {
                alert("No any data");
                return;
            }

            let jsonStr = JSON.stringify(datas, null, 2);
            console.log(jsonStr);

            const blobData = new Blob([jsonStr], { type: "application/json" });
            console.log(blobData);
            const url = URL.createObjectURL(blobData);
            console.log(url);

            const a = document.createElement("a");
            a.href = url;
            a.download = "record.json";
            document.body.appendChild(a);
            //a.text = "download"
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);


        }



        delEl.addEventListener("click", function () {

            if (!confirm("are you sure all del ?")) {
                return;
            }

            localStorage.removeItem("record")
            localStorage.removeItem("#tableRecord")
            //window.location.href = "";
            avg = 0;
            data.total = 0;
            data.count = 0;
            document.querySelector("#record").innerHTML = `Many ${data.count} avg ${avg}`;

            datas = [];

            document.querySelector("#tableRecord").innerHTML = "";



        });



        let data = {
            total: 0,
            count: 0



        }

        let datas = JSON.parse(localStorage.getItem("datas")) || [];

        record = JSON.parse(localStorage.getItem("record"));


        if (record) {
            data = record;
            let avg = (data.total / data.count).toFixed(1)
            document.querySelector("#record").innerHTML = `Many ${data.count} avg ${avg}`
        }


        if (datas.length > 0) {
            rendertable(datas);
        }


        function addRow(data) {
            return `
            <tr>
                <td>${data.name}</td>
                <td>${data.county}</td>
                <td>${data.age}</td>
                <td>${data.sex}</td>
                <td>${data.height}</td>
                <td>${data.weight}</td>
                <td>${data.bmi}</td>
            </tr>
            `
        }

        function rendertable(datas) {
            tableData = "";

            for (let i = 0; i < datas.length; i++) {
                console.log(i + 1, datas[i]);

                tableData += addRow(datas[i]);
            }




            let tableHtml = `
                <table border="1px">
                    <thead>
                        <tr>
                            <th>name</th>
                            <th>county</th>
                            <th>age</th>
                            <th>sex</th>
                            <th>height</th>
                            <th>weight</th>
                            <th>BMI</th>

                        </tr>
                    </thead>
                    <tbody>
                    ${tableData}

                    </tbody>

                </table>
            `


            console.log(tableData);

            document.querySelector("#tableRecord").innerHTML = tableHtml

        }









        function calc() {
            let height = heightEl.value;
            let weight = weightEl.value;

            if (height <= 0 || weight <= 0) {
                alert("please input number ")
                return;
            }

            document.querySelector("#result").hidden = false;


            let bmi = get_BMI(height, weight);
            let result = getComment(bmi);
            console.log(bmi, result[0], result[1]);




            const bmiEl = document.querySelector(".bmi")
            bmiEl.innerText = bmi;
            bmiEl.style.color = result[1]

            document.querySelector(".comment").innerText = result[0]
            document.querySelector(".comment").style.color = result[1]

            let sexEl = document.querySelector("input[name='sex']:checked");
            let userinfo = `${nameEl.value} age:${age.value} county:${countyEl.value} sex:${sexEl.value}`

            document.querySelector("#info").innerHTML = `<h1>${nameEl.value} age:${age.value} county:${countyEl.value} sex:${sexEl.value}</h1>`




            data['total'] += Number(bmi);
            data.count += 1
            let avg = (data.total / data.count).toFixed(1)
            console.log(data);

            document.querySelector("#record").innerHTML = `Many ${data.count} avg ${avg}`


            localStorage.setItem("record", JSON.stringify(data))
            localStorage.setItem("bmi", bmi)


            let person = {
                name: nameEl.value,
                age: ageEl.value,
                height: weight,
                weight: weight,
                bmi: bmi,
                sex: sexEl.value,
                county: countyEl.value
            }

            datas.push(person);
            //console.log((datas));

            localStorage.setItem("datas", JSON.stringify(datas));

            rendertable(datas);

        }











    </script>


</body>

</html>
